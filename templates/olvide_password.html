<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CouperTech - Restablecer Contraseña</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
               background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
               min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-container {
            background: rgba(255,255,255,0.95);
            border-radius: 16px; padding: 48px 40px;
            width: 100%; max-width: 440px; margin: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo { text-align: center; margin-bottom: 32px; }
        .logo h1 { font-size: 28px; color: #1a1a2e; }
        .logo h1 span { color: #e94560; }
        .logo p { color: #666; font-size: 14px; margin-top: 4px; }
        .card { display: none; }
        .card.active { display: block; }
        .hint { background: #f0f4ff; color: #302b63; padding: 12px 14px; border-radius: 8px;
                font-size: 13px; margin-bottom: 20px; line-height: 1.5; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600;
                            color: #333; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px 16px; font-size: 15px;
                            border: 2px solid #e0e0e0; border-radius: 8px;
                            transition: border-color 0.2s; outline: none; font-family: inherit; }
        .form-group input:focus { border-color: #302b63; }
        .btn-primary { width: 100%; padding: 14px; font-size: 16px; font-weight: 600;
                     background: linear-gradient(135deg, #302b63, #24243e);
                     color: white; border: none; border-radius: 8px;
                     cursor: pointer; transition: transform 0.15s; }
        .btn-primary:hover { transform: translateY(-1px); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .error, .success { padding: 12px; border-radius: 8px;
                 font-size: 14px; margin-bottom: 16px; display: none; }
        .error { background: #fff0f0; color: #e94560; }
        .success { background: #f0fff4; color: #1a7f4e; }
        .error.show, .success.show { display: block; }
        .footer { text-align: center; margin-top: 24px; font-size: 13px; color: #999; }
        .footer a { color: #302b63; text-decoration: none; font-weight: 600; }
        .spinner { display: none; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3);
                   border-radius: 50%; border-top-color: #fff;
                   animation: spin 0.8s linear infinite; margin: 0 auto; }
        .btn-primary.loading .btn-text { display: none; }
        .btn-primary.loading .spinner { display: block; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="logo">
            <h1>Couper<span>Tech</span></h1>
            <p>Restablecer Contraseña</p>
        </div>

        <!-- Card 1: pedir el email -->
        <div class="card active" id="cardEmail">
            <div class="error" id="errorEmail"></div>
            <div class="success" id="successEmail"></div>
            <form id="formEmail" onsubmit="return handleForgotPassword(event)">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="tu@correo.com" required autofocus>
                </div>
                <button type="submit" class="btn-primary" id="btnEmail">
                    <span class="btn-text">Enviar código</span>
                    <div class="spinner"></div>
                </button>
            </form>
        </div>

        <!-- Card 2: pegar el codigo + nueva contraseña -->
        <div class="card" id="cardReset">
            <div class="hint">
                Este entorno todavía no envía correos reales: el código de restablecimiento
                se imprime en la consola/logs del servicio de autenticación
                (<code>authservise</code>) como <code>[EMAIL DUMMY]</code>. Cópialo desde ahí y
                pégalo aquí abajo.
            </div>
            <div class="error" id="errorReset"></div>
            <div class="success" id="successReset"></div>
            <form id="formReset" onsubmit="return handleResetPassword(event)">
                <div class="form-group">
                    <label for="token">Código de restablecimiento</label>
                    <input type="text" id="token" placeholder="Pega aquí el código" required autofocus>
                </div>
                <div class="form-group">
                    <label for="nuevaPassword">Nueva contraseña</label>
                    <input type="password" id="nuevaPassword" placeholder="Mínimo 8 caracteres" required minlength="8">
                </div>
                <button type="submit" class="btn-primary" id="btnReset">
                    <span class="btn-text">Restablecer contraseña</span>
                    <div class="spinner"></div>
                </button>
            </form>
        </div>

        <div class="footer">
            <a href="/">&larr; Volver a iniciar sesión</a>
        </div>
    </div>
    <script>
        // ============================================================
        // Mismo patron que registro.html/alta_cliente.html: pega directo
        // del navegador al servicio de autenticacion publico, sin pasar
        // por el backend del portal (CORS abierto, expuesto via tunel
        // cloudflared) -- forgot/reset-password son operaciones anonimas,
        // no requieren cookie de sesion, asi que no hace falta proxy.
        // ============================================================
        const AUTH_SERVICE_PUBLIC_URL = 'https://auth.coupertech.com';
        const FORGOT_PASSWORD_ENDPOINT = `${AUTH_SERVICE_PUBLIC_URL}/auth/forgot-password`;
        const RESET_PASSWORD_ENDPOINT = `${AUTH_SERVICE_PUBLIC_URL}/auth/reset-password`;

        function mostrarCard(id) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        async function handleForgotPassword(e) {
            e.preventDefault();
            const btn = document.getElementById('btnEmail');
            const error = document.getElementById('errorEmail');
            const success = document.getElementById('successEmail');
            error.classList.remove('show');
            success.classList.remove('show');

            const email = document.getElementById('email').value.trim();
            if (!email) {
                error.textContent = 'Ingresa tu correo electrónico';
                error.classList.add('show');
                return;
            }

            btn.classList.add('loading');
            btn.disabled = true;

            try {
                const resp = await fetch(FORGOT_PASSWORD_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await resp.json().catch(() => ({}));

                if (resp.status === 429) {
                    error.textContent = 'Demasiados intentos. Espera unos minutos e intenta de nuevo.';
                    error.classList.add('show');
                } else {
                    // Respuesta generica (anti-enumeracion): mismo mensaje
                    // exista o no la cuenta -- se pasa a la card 2 siempre.
                    document.getElementById('token').value = '';
                    document.getElementById('nuevaPassword').value = '';
                    document.getElementById('errorReset').classList.remove('show');
                    document.getElementById('successReset').classList.remove('show');
                    mostrarCard('cardReset');
                }
            } catch (err) {
                error.textContent = 'Error de conexión con el servicio. Intenta de nuevo.';
                error.classList.add('show');
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
            return false;
        }

        async function handleResetPassword(e) {
            e.preventDefault();
            const btn = document.getElementById('btnReset');
            const error = document.getElementById('errorReset');
            const success = document.getElementById('successReset');
            error.classList.remove('show');
            success.classList.remove('show');

            const token = document.getElementById('token').value.trim();
            const password = document.getElementById('nuevaPassword').value;

            if (!token || !password) {
                error.textContent = 'Completa el código y la nueva contraseña';
                error.classList.add('show');
                return;
            }
            if (password.length < 8) {
                error.textContent = 'La contraseña debe tener al menos 8 caracteres';
                error.classList.add('show');
                return;
            }

            btn.classList.add('loading');
            btn.disabled = true;

            try {
                const resp = await fetch(RESET_PASSWORD_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });
                const data = await resp.json().catch(() => ({}));

                if (resp.ok) {
                    success.textContent = 'Contraseña actualizada. Ya puedes iniciar sesión.';
                    success.classList.add('show');
                    document.getElementById('formReset').reset();
                    setTimeout(() => { window.location.href = '/'; }, 1800);
                } else {
                    error.textContent = data.detail || 'No se pudo restablecer la contraseña. Verifica el código.';
                    error.classList.add('show');
                }
            } catch (err) {
                error.textContent = 'Error de conexión con el servicio. Intenta de nuevo.';
                error.classList.add('show');
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
            return false;
        }
    </script>
</body>
</html>
