<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CouperTech - Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
               background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
               min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-container {
            background: rgba(255,255,255,0.95);
            border-radius: 16px; padding: 48px 40px;
            width: 100%; max-width: 420px; margin: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo { text-align: center; margin-bottom: 32px; }
        .logo h1 { font-size: 28px; color: #1a1a2e; }
        .logo h1 span { color: #e94560; }
        .logo p { color: #666; font-size: 14px; margin-top: 4px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600;
                            color: #333; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px 16px; font-size: 15px;
                            border: 2px solid #e0e0e0; border-radius: 8px;
                            transition: border-color 0.2s; outline: none; }
        .form-group input:focus { border-color: #302b63; }
        .btn-login { width: 100%; padding: 14px; font-size: 16px; font-weight: 600;
                     background: linear-gradient(135deg, #302b63, #24243e);
                     color: white; border: none; border-radius: 8px;
                     cursor: pointer; transition: transform 0.15s; }
        .btn-login:hover { transform: translateY(-1px); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
        .error { background: #fff0f0; color: #e94560; padding: 12px; border-radius: 8px;
                 font-size: 14px; margin-bottom: 16px; display: none; }
        .error.show { display: block; }
        .footer { text-align: center; margin-top: 24px; font-size: 13px; color: #999; }
        .spinner { display: none; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3);
                   border-radius: 50%; border-top-color: #fff;
                   animation: spin 0.8s linear infinite; margin: 0 auto; }
        .btn-login.loading .btn-text { display: none; }
        .btn-login.loading .spinner { display: block; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>Couper<span>Tech</span></h1>
            <p>Portal de Plataforma Cloud</p>
        </div>
        <div class="error" id="errorMsg"></div>
        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="tu@correo.com" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            {% if turnstile_site_key %}
            <div class="cf-turnstile" data-sitekey="{{ turnstile_site_key }}" data-callback="onTurnstileOk"></div>
            {% endif %}
            <button type="submit" class="btn-login" id="loginBtn" {% if turnstile_site_key %}disabled{% endif %}>
                <span class="btn-text">Entrar a la plataforma</span>
                <div class="spinner"></div>
            </button>
        </form>
        <div class="footer">&copy; 2026 CouperTech &mdash; Todos los derechos reservados</div>
    </div>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script>
        // Slug con el que este login se identifica ante el login GENERICO de
        // authservice -- inyectado por el backend (SERVICIO_SLUG), no
        // hardcodeado: el mismo login.html puede servir para otros puntos de
        // entrada de CouperTech con solo cambiar esa variable de entorno.
        const SERVICIO = "{{ servicio_slug }}";

        function onTurnstileOk() {
            document.getElementById('loginBtn').disabled = false;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const error = document.getElementById('errorMsg');
            error.classList.remove('show');

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const turnstileToken = typeof turnstile !== 'undefined' ? turnstile.getResponse() : undefined;

            if (!email || !password) {
                error.textContent = 'Ingresa tu correo y contraseña';
                error.classList.add('show');
                return;
            }

            btn.classList.add('loading');
            btn.disabled = true;

            try {
                const resp = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, servicio: SERVICIO, turnstile_token: turnstileToken })
                });
                const data = await resp.json();

                if (resp.ok && data.status === 'ok') {
                    // La cookie de sesion la fija el servidor (Set-Cookie,
                    // httponly) en la respuesta de /api/login -- el JS ya
                    // no la maneja ni puede leerla.
                    window.location.href = '/dashboard';
                } else {
                    error.textContent = data.error || 'Correo o contraseña incorrectos';
                    error.classList.add('show');
                    // El token de Turnstile es de un solo uso -- sin resetear,
                    // un segundo intento fallaria siempre por captcha aunque
                    // la contraseña ahora sea correcta.
                    if (typeof turnstile !== 'undefined') turnstile.reset();
                }
            } catch (err) {
                error.textContent = 'Error de conexión. Intenta de nuevo.';
                error.classList.add('show');
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
            return false;
        }
    </script>
</body>
</html>
