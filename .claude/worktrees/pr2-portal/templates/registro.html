<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CouperTech - Crear cuenta</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
               background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
               min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .registro-container {
            background: rgba(255,255,255,0.95);
            border-radius: 16px; padding: 48px 40px;
            width: 100%; max-width: 460px; margin: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo { text-align: center; margin-bottom: 32px; }
        .logo h1 { font-size: 28px; color: #1a1a2e; }
        .logo h1 span { color: #e94560; }
        .logo p { color: #666; font-size: 14px; margin-top: 4px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600;
                            color: #333; margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 12px 16px; font-size: 15px;
                            border: 2px solid #e0e0e0; border-radius: 8px;
                            transition: border-color 0.2s; outline: none;
                            font-family: inherit; background: white; }
        .form-group input:focus, .form-group select:focus { border-color: #302b63; }
        .form-hint { font-size: 12px; color: #888; margin-top: 4px; }
        .turnstile-wrap { margin-bottom: 20px; display: flex; justify-content: center; }
        .btn-registro { width: 100%; padding: 14px; font-size: 16px; font-weight: 600;
                     background: linear-gradient(135deg, #302b63, #24243e);
                     color: white; border: none; border-radius: 8px;
                     cursor: pointer; transition: transform 0.15s; }
        .btn-registro:hover { transform: translateY(-1px); }
        .btn-registro:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .error, .success { padding: 12px; border-radius: 8px;
                 font-size: 14px; margin-bottom: 16px; display: none; }
        .error { background: #fff0f0; color: #e94560; }
        .success { background: #f0fff4; color: #1a7f4e; }
        .error.show, .success.show { display: block; }
        .footer { text-align: center; margin-top: 24px; font-size: 13px; color: #999; }
        .footer a { color: #302b63; text-decoration: none; font-weight: 600; }
        .spinner { display: none; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3);
                   border-radius: 50%; border-top-color: #fff;
                   animation: spin 0.8s linear infinite; margin: 0 auto; }
        .btn-registro.loading .btn-text { display: none; }
        .btn-registro.loading .spinner { display: block; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="registro-container">
        <div class="logo">
            <h1>Couper<span>Tech</span></h1>
            <p>Crea tu cuenta en la nube CouperTech</p>
        </div>
        <div class="error" id="errorMsg"></div>
        <div class="success" id="successMsg"></div>
        <form id="registroForm" onsubmit="return handleRegistro(event)">
            <div class="form-group">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" placeholder="Tu nombre completo" required autofocus maxlength="255">
            </div>
            <div class="form-group">
                <label for="email">Correo</label>
                <input type="email" id="email" placeholder="tu@correo.com" required maxlength="255">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Minimo 8 caracteres" required minlength="8">
            </div>
            <div class="form-group">
                <label for="empresa">Empresa <span style="font-weight:400;color:#999;">(opcional)</span></label>
                <input type="text" id="empresa" placeholder="Nombre de tu empresa" maxlength="255">
            </div>
            <div class="form-group">
                <label for="uso">¿Para qué la vas a usar?</label>
                <select id="uso" required>
                    <option value="" disabled selected>Selecciona una opción</option>
                    <option value="trabajo">Trabajo</option>
                    <option value="personal">Personal</option>
                    <option value="estudiante">Estudiante</option>
                </select>
            </div>
            <div class="turnstile-wrap">
                {% if turnstile_site_key %}
                <div class="cf-turnstile" data-sitekey="{{ turnstile_site_key }}" data-callback="onTurnstileOk" data-error-callback="onTurnstileError"></div>
                {% endif %}
            </div>
            <button type="submit" class="btn-registro" id="registroBtn">
                <span class="btn-text">Crear cuenta</span>
                <div class="spinner"></div>
            </button>
        </form>
        <div class="footer">¿Ya tienes cuenta? <a href="/">Inicia sesión</a></div>
    </div>
    <script>
        // ============================================================
        // CONFIG: URL publica de authservice (mismo patron que login.html
        // con N8N_BASE_URL). El fetch va directo del navegador al backend
        // de autenticacion -- CORS ya esta abierto (allow_origins=["*"])
        // en authservice/main.py. Expuesto via tunel cloudflared, Public
        // Hostname configurado en el dashboard de Cloudflare (02/jul/2026).
        // ============================================================
        const AUTH_SERVICE_PUBLIC_URL = 'https://auth.coupertech.com';
        const REGISTRO_ENDPOINT = `${AUTH_SERVICE_PUBLIC_URL}/auth/registro`;

        let turnstileToken = null;

        function onTurnstileOk(token) {
            turnstileToken = token;
        }

        function onTurnstileError() {
            turnstileToken = null;
        }

        async function handleRegistro(e) {
            e.preventDefault();
            const btn = document.getElementById('registroBtn');
            const error = document.getElementById('errorMsg');
            const success = document.getElementById('successMsg');
            error.classList.remove('show');
            success.classList.remove('show');

            const nombre = document.getElementById('nombre').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const empresa = document.getElementById('empresa').value.trim();
            const uso = document.getElementById('uso').value;

            if (!nombre || !email || !password || !uso) {
                error.textContent = 'Completa todos los campos requeridos';
                error.classList.add('show');
                return;
            }
            if (password.length < 8) {
                error.textContent = 'La contraseña debe tener al menos 8 caracteres';
                error.classList.add('show');
                return;
            }

            btn.classList.add('loading');
            btn.disabled = true;

            try {
                const resp = await fetch(REGISTRO_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nombre,
                        email,
                        password,
                        empresa: empresa || null,
                        uso,
                        turnstile_token: turnstileToken
                    })
                });
                const data = await resp.json().catch(() => ({}));

                if (resp.status === 202) {
                    // Respuesta generica (anti-enumeracion): mismo mensaje
                    // exista o no el correo ya registrado.
                    success.textContent = data.message || 'Registro recibido. Revisa tu correo.';
                    success.classList.add('show');
                    document.getElementById('registroForm').reset();
                    turnstileToken = null;
                } else if (resp.status === 429) {
                    error.textContent = 'Demasiados intentos. Espera unos minutos e intenta de nuevo.';
                    error.classList.add('show');
                } else {
                    error.textContent = data.detail || 'No se pudo completar el registro. Verifica tus datos.';
                    error.classList.add('show');
                }
            } catch (err) {
                error.textContent = 'Error de conexión con el servicio. Intenta de nuevo.';
                error.classList.add('show');
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
            return false;
        }
    </script>
</body>
</html>
